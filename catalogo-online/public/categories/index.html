<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Online | IMPORT FULL</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="container" style="padding-top: 2rem;">
    <div class="hero-center">
      <img id="heroLogoImg" src="" style="display: none; max-height: 120px; width: auto; object-fit: contain; margin: 0 auto 1.25rem auto;" class="logo-center" alt="IMPORT FULL" onerror="handleLogoError()">
      <div id="heroBrandText" style="font-weight: 800; font-size: 2.5rem; color: #f97316;">IMPORT FULL</div>
      <h1 style="font-size: 1.8rem; margin-top: 0.5rem;">Catálogo de Productos</h1>
      <p style="color: var(--text-secondary); margin-top: 0.5rem;">Seleccioná una categoría para ver precios y armar tu pedido</p>
      
      <!-- Flat Circular Vector Social Icons & Integrated Theme Switcher -->
      <div class="social-bar">
        <a id="socialIg" href="#" target="_blank" class="social-icon-btn" title="Instagram">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
        <a id="socialFb" href="#" target="_blank" class="social-icon-btn" title="Facebook">
          <svg viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.374 14.5 5 15.5 5H18V0h-3.808C10.592 0 9 1.592 9 4.615V8z"/></svg>
        </a>
        <a id="socialWp" href="#" target="_blank" class="social-icon-btn" title="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.099 4.019 4.019-1.099z"/></svg>
        </a>

        <!-- Flat Theme Switcher Button -->
        <button class="social-icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar Tema Modo Claro / Oscuro">
          <svg id="sunIcon" viewBox="0 0 24 24" style="display: block;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/></svg>
          <svg id="moonIcon" viewBox="0 0 24 24" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div class="categories-grid" id="categoriesContainer"></div>

    <!-- Footer Section with 2-Column Card -->
    <div class="footer-section">
      <div class="footer-card">
        <div class="footer-item">
          <div class="footer-icon-circle">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          </div>
          <div>
            <div class="footer-item-title">DIRECCIÓN</div>
            <div class="footer-item-text" id="footerAddress"><a href="#" class="footer-item-link" id="footerAddressLink">Pasteur 320, Balvanera, CABA</a></div>
          </div>
        </div>

        <div class="footer-item">
          <div class="footer-icon-circle">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
          </div>
          <div>
            <div class="footer-item-title">HORARIOS DE ATENCIÓN</div>
            <div class="footer-item-text" id="footerHours">Lunes a Viernes de 9:00 a 18:00 hs. Sábados de 9:00 a 13:00 hs.</div>
          </div>
        </div>
      </div>

      <div class="powered-by">
        Power by - <span>Guias Locales</span>
      </div>
    </div>
  </main>

  <script>
    let config = {};
    let loadedCategories = [];

    function applySavedTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('sunIcon').style.display = 'none';
        document.getElementById('moonIcon').style.display = 'block';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('sunIcon').style.display = 'block';
        document.getElementById('moonIcon').style.display = 'none';
      }
      updateLogos();
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.getElementById('sunIcon').style.display = isLight ? 'none' : 'block';
      document.getElementById('moonIcon').style.display = isLight ? 'block' : 'none';
      updateLogos();
    }

    function handleLogoError() {
      document.getElementById('heroLogoImg').style.display = 'none';
      document.getElementById('heroBrandText').style.display = 'block';
    }

    function updateLogos() {
      const isLight = document.body.classList.contains('light-theme');
      let logoUrl = isLight ? config.logo_light_url : config.logo_dark_url;

      if (!logoUrl || logoUrl.trim() === '') {
        logoUrl = config.logo_light_url || config.logo_dark_url || config.logo_url || config.logo;
      }

      const heroLogo = document.getElementById('heroLogoImg');
      const heroText = document.getElementById('heroBrandText');

      if (logoUrl && logoUrl.trim() !== '') {
        heroLogo.src = logoUrl;
        heroLogo.style.display = 'block';
        heroText.style.display = 'none';
      } else {
        heroLogo.style.display = 'none';
        heroText.style.display = 'block';
      }
    }

    const defaultCategoryImageMap = {
      'BAZAR': 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=600&q=80',
      'BELLEZA': 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80',
      'JUGUETERIA': 'https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&w=600&q=80',
      'BIJOUTERIE': 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=600&q=80',
      'ELECTRONICA': 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80',
      'LIBRERIA': 'https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?auto=format&fit=crop&w=600&q=80',
      'COTILLON': 'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80',
      'FERRETERIA': 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80',
      'INDUMENTARIA': 'https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=600&q=80',
      'NAVIDAD': 'https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=600&q=80',
      'TELEFONIA': 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80',
      'DESCARTABLE': 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=600&q=80'
    };

    const fallbackList = [
      'BAZAR', 'BELLEZA', 'JUGUETERIA', 'BIJOUTERIE', 
      'ELECTRONICA', 'LIBRERIA', 'COTILLON', 'FERRETERIA', 
      'INDUMENTARIA', 'NAVIDAD', 'TELEFONIA', 'DESCARTABLE'
    ];

    function renderCategoryGrid(categories) {
      const container = document.getElementById('categoriesContainer');
      const list = (Array.isArray(categories) && categories.length > 0) ? categories : fallbackList;
      loadedCategories = list;

      container.innerHTML = list.map((cat) => {
        const upperCat = String(cat || '').toUpperCase();
        const customUrl = config[`cat_img_${upperCat}`];
        const bgImg = (customUrl && customUrl.trim() !== '') ? customUrl : (defaultCategoryImageMap[upperCat] || defaultCategoryImageMap['BAZAR']);

        return `
          <div class="category-card" style="background-image: url('${bgImg}');" onclick="window.location.href='/catalog?category=${encodeURIComponent(cat)}'">
            <div class="category-card-content">
              <div class="category-card-title">${cat}</div>
              <div class="category-card-subtitle">Ver productos de ${cat} &rsaquo;</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyConfig(cfg) {
      if (!cfg) return;
      config = { ...config, ...cfg };
      updateLogos();
      renderCategoryGrid(loadedCategories);

      if (config.store_address) {
        document.getElementById('footerAddressLink').textContent = config.store_address;
        document.getElementById('footerAddressLink').href = `https://maps.google.com/?q=${encodeURIComponent(config.store_address)}`;
      }
      if (config.store_hours) {
        document.getElementById('footerHours').textContent = config.store_hours;
      }
      if (config.instagram_url) document.getElementById('socialIg').href = config.instagram_url;
      if (config.whatsapp_number) document.getElementById('socialWp').href = `https://wa.me/${config.whatsapp_number}`;
    }

    async function initPage() {
      // 1. Instant load from local backup
      try {
        const backupRaw = localStorage.getItem('store_config_backup');
        if (backupRaw) {
          applyConfig(JSON.parse(backupRaw));
        }
      } catch (e) {}

      applySavedTheme();
      renderCategoryGrid(fallbackList);

      try {
        const catRes = await fetch('/api/categories');
        if (catRes.ok) {
          const categories = await catRes.json();
          if (Array.isArray(categories) && categories.length > 0) {
            renderCategoryGrid(categories);
          }
        }
      } catch (err) {}

      // 2. Fetch server API config
      try {
        const confRes = await fetch('/api/config');
        if (confRes.ok) {
          const serverConfig = await confRes.json();
          applyConfig(serverConfig);
        }
      } catch (err) {}
    }

    initPage();
  </script>
</body>
</html>
